interface:
  display_name: "Ask Sage"
  icon_small: "./assets/sage-buddha-icon.png"
  icon_large: "./assets/sage-buddha.png"
  brand_color: "#133E36"
  short_description: "Zendesk product, release, and troubleshooting answers"
  default_prompt: "Use $answer-zendesk-questions to research or interpret this Zendesk question for a Scaled CSM, following any source constraints I give."

dependencies:
  tools:
    - type: "mcp"
      value: "z2-help-center"
      description: "Official Zendesk Help Center documentation"
      transport: "streamable_http"
      url: "https://mcp-gateway.zende.sk/mcps/z2-help-center"
    - type: "mcp"
      value: "tavily"
      description: "Public web and Zendesk Community discovery and retrieval"
      transport: "streamable_http"
      url: "https://mcp-gateway.zende.sk/mcps/tavily"
    - type: "mcp"
      value: "slack"
      description: "Read-only live Slack channel and thread research"
      transport: "streamable_http"
      url: "https://mcp-gateway.zende.sk/mcps/slack"
    - type: "mcp"
      value: "z2-ticket-context"
      description: "Read-only Z2 cases, Problem Tickets, and diagnostic history"
      transport: "streamable_http"
      url: "https://mcp-gateway.zende.sk/mcps/z2-ticket-context"

policy:
  allow_implicit_invocation: true
