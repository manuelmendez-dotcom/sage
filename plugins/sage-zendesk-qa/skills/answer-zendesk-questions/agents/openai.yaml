interface:
  display_name: "SAGE CSM Q&A"
  short_description: "Source-aware Zendesk briefings for CSMs"
  default_prompt: "Use $answer-zendesk-questions to research or interpret this Zendesk question for a Scaled CSM, following any source constraints I give."

dependencies:
  tools:
    - type: "mcp"
      value: "z2-help-center"
      description: "Official Zendesk Help Center documentation"
      transport: "streamable_http"
      url: "https://mcp-gateway.zende.sk/mcps/z2-help-center"
    - type: "mcp"
      value: "tavily"
      description: "Official Zendesk public web discovery and retrieval"
      transport: "streamable_http"
      url: "https://mcp-gateway.zende.sk/mcps/tavily"
    - type: "mcp"
      value: "unleash"
      description: "Indexed Zendesk internal knowledge, Slack, and Jira"
      transport: "streamable_http"
      url: "https://mcp-gateway.zende.sk/mcps/unleash"
    - type: "mcp"
      value: "slack"
      description: "Read-only live Slack channel and thread research"
      transport: "streamable_http"
      url: "https://mcp-gateway.zende.sk/mcps/slack"
    - type: "mcp"
      value: "google-drive"
      description: "Zendesk enablement, decks, playbooks, and positioning"
      transport: "streamable_http"
      url: "https://mcp-gateway.zende.sk/mcps/google-drive"
    - type: "mcp"
      value: "zendeskdev"
      description: "Internal Zendesk engineering knowledge and technical context"
      transport: "streamable_http"
      url: "https://mcp-gateway.zende.sk/mcps/zendeskdev"

policy:
  allow_implicit_invocation: true
